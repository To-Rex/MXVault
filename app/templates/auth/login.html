<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MXVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up 0.5s ease-out both; }
    .animate-fade-up-delayed { animation: fade-up 0.5s 0.1s ease-out both; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 antialiased">

  <div class="flex min-h-full items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-sm space-y-8">

      <!-- Logo -->
      <div class="text-center animate-fade-up">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-brand-600">
          <span class="text-lg font-bold tracking-tight text-white">M</span>
        </div>
        <h1 class="mt-5 text-2xl font-semibold tracking-tight">MXVault</h1>
        <p class="mt-1.5 text-sm text-zinc-500">PostgreSQL Backup Management</p>
      </div>

      <!-- Card -->
      <div class="animate-fade-up-delayed rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
        <h2 class="text-lg font-semibold">Welcome back</h2>
        <p class="mt-1 text-sm text-zinc-500">Sign in to your account</p>

        {% if error %}
        <div class="mt-5 rounded-xl border border-red-500/20 bg-red-500/5 px-4 py-3">
          <div class="flex items-start gap-3">
            <svg class="mt-0.5 h-4 w-4 shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p class="text-sm text-red-300">{{ error }}</p>
          </div>
        </div>
        {% endif %}

        <form method="post" action="/auth/login" class="mt-6 space-y-5">
          <div>
            <label class="block text-sm font-medium text-zinc-400">Username</label>
            <input type="text" name="username" required
                   class="mt-2 block w-full rounded-xl border border-zinc-700 bg-zinc-800 px-3.5 py-2.5 text-sm text-zinc-100 placeholder:text-zinc-500 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-colors"
                   placeholder="Enter your username"
                   autocomplete="username" autofocus>
          </div>
          <div>
            <label class="block text-sm font-medium text-zinc-400">Password</label>
            <input type="password" name="password" required
                   class="mt-2 block w-full rounded-xl border border-zinc-700 bg-zinc-800 px-3.5 py-2.5 text-sm text-zinc-100 placeholder:text-zinc-500 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-colors"
                   placeholder="Enter your password"
                   autocomplete="current-password">
          </div>

          <button type="submit"
                  class="group mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-zinc-900 active:scale-[0.98]">
            Sign In
            <svg class="h-4 w-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- Footer -->
      <p class="text-center text-xs text-zinc-700">
        MXVault v1.0.0
      </p>

    </div>
  </div>

</body>
</html>
